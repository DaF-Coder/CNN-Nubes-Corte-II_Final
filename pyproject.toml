
[project]
name = "clouds-cnn-mlops"
version = "0.1.0"
description = "Clasificación de 11 categorías de nubes mediante una CNN y prácticas MLOps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.0,<2.15",
    "torchvision>=0.29.0,<0.30",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "mlflow>=2.18,<4",
    "h5py>=3.12,<4",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clouds_cnn"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
